name: Publish Alafasy Collected Surahs and Timings

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-collected-alafasy-v1
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Ensure audio inspection utility is installed
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Retrieve BOTH original v1.0.0 release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p input
          gh release download v1.0.0 --dir input --pattern 'alafasy-collected-quran.zip'
          gh release download v1.0.0 --dir input --pattern 'Alafasy-Timings-114-Surahs.zip'
          test -s input/alafasy-collected-quran.zip
          test -s input/Alafasy-Timings-114-Surahs.zip
      - name: Verify original SHA256 checksums
        shell: bash
        run: |
          echo 'f89a1daf20953c655beeadc3437ec9b53736e8a1e69df403147a2a9bb4fce65a  input/alafasy-collected-quran.zip' | sha256sum --check --status
          echo '8f46149e35bfb54733d9c39934c85b1ef5ea5111b886542e088c8e3eeb5e970f  input/Alafasy-Timings-114-Surahs.zip' | sha256sum --check --status
      - name: Normalize and structurally validate all 114 chapters
        shell: bash
        run: |
          python3 scripts/prepare-collected-assets.py \
            --audio input/alafasy-collected-quran.zip \
            --timings input/Alafasy-Timings-114-Surahs.zip \
            --out prepared
      - name: Upload the 114 MP3 files and the 114 timing files as individual release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view v1.0.0 --json assets --jq '.assets[].name' > published.txt
          for file in prepared/audio/*.mp3 prepared/timings/*.json prepared/collected-manifest.json; do
            filename="$(basename "$file")"
            if grep -Fxq "$filename" published.txt; then
              echo "Already published: $filename"
              continue
            fi
            echo "Uploading $filename"
            success=0
            for attempt in 1 2 3; do
              if gh release upload v1.0.0 "$file"; then
                success=1
                break
              fi
              echo "Retry $attempt for $filename"
              sleep 10
            done
            if [ "$success" -ne 1 ]; then
              echo "Upload failed: $filename" >&2
              exit 1
            fi
          done
      - name: Check release has all the individual files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view v1.0.0 --json assets --jq '.assets[].name' > published-final.txt
          for number in $(seq -w 001 114); do
            grep -Fxq "${number}.mp3" published-final.txt
            grep -Fxq "timings-${number}.json" published-final.txt
          done
          grep -Fxq 'collected-manifest.json' published-final.txt
          echo 'Published 114 MP3s and 114 timing JSONs.'
